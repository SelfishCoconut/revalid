[project]
name = "revalid"
version = "0.4.0"
description = "AI-Driven System for the Revalidation of Pentest Findings (TFG, ESII-UCLM)"
readme = "README.md"
license = "Beerware"
license-files = ["LICENSE"]
authors = [{ name = "Álvaro Navarro", email = "alvaronavaqui@proton.me" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pydantic>=2.9",
    "pydantic-ai-slim[anthropic,openai]>=2.9.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
# FR-14 browser-driven probes (ADR-0018). Optional: HTTP-only paths never import
# it. Enable with `uv sync --extra browser && uv run playwright install chromium`.
browser = ["playwright>=1.48"]
# FR-17 agentic retest sandbox (ADR-0025). Optional: HTTP/unit paths never
# import it. Enable with `uv sync --extra sandbox`.
sandbox = ["docker>=7.0"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    # sanity metrics (codebase-sanity agent / sanity.yml)
    "radon>=6.0",
    "xenon>=0.9",
    "vulture>=2.13",
    "pylint>=3.3",
    "pydeps>=3.0",
    # documentation (docs-as-code, §11 of the development plan)
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-mermaid2-plugin>=1.2",
    "reportlab>=4.2",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["uv_build>=0.5,<1"]
build-backend = "uv_build"

# ---------------------------------------------------------------- uv
[tool.uv]
# Security floors on transitive dependencies, pinned without making them direct
# deps. Remove each once an upstream floor covers it.
#   - starlette < 1.3.1  → PYSEC-2026-249 (pulled in by FastAPI/Starlette)
#   - setuptools < 83.0.0 → PYSEC-2026-3447 (build/tooling transitive)
constraint-dependencies = ["starlette>=1.3.1", "setuptools>=83.0.0"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "S",         # bandit (security — this is a security tool)
    "C90",       # mccabe complexity
    "N",         # naming
    "D",         # pydocstyle (docstrings feed the generated docs)
    "RUF",
]
ignore = [
    "D203", "D213",  # incompatible docstring-style pairs (use D211/D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "D"]  # asserts + fake tokens/passwords in fixtures; docstrings optional
".claude/hooks/**" = ["S603", "S607"]  # local trusted hook scripts calling git

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
pretty = true

# pdfplumber ships no type information (no py.typed); reportlab is a dev-only
# dependency used by the fixture generator. Silence missing-import errors.
[[tool.mypy.overrides]]
module = ["pdfplumber.*", "reportlab.*"]
ignore_missing_imports = true

# playwright is the optional `browser` extra — not installed in the lint/unit CI
# job, and imported lazily inside revalid.browser. Silence the missing import
# there; the browser probe path is exercised by the system-marked test.
[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true

# docker is the optional `sandbox` extra — not installed in the lint/unit CI
# job, and imported lazily inside revalid.sandbox. Silence the missing import
# there; the live DockerSandbox path is exercised by the system-marked test.
[[tool.mypy.overrides]]
module = ["docker.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on sys.path so shared, non-test helper modules (e.g.
# tests/_retest_helpers.py, marked by tests/__init__.py as a regular package)
# are importable as `tests.<module>` from any test subpackage (unit,
# integration, system) even though those subpackages have no __init__.py.
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "integration: real component interactions; LLM via deterministic Pydantic AI stand-ins (CI: separate job)",
    "system: full E2E against dockerized lab targets (CI: nightly/workflow_dispatch only)",
]
filterwarnings = [
    # pydantic-ai's run_sync uses asyncio.get_event_loop() internally.
    "ignore:There is no current event loop:DeprecationWarning",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["src/revalid"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
