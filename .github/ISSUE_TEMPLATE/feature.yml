name: Feature / requirement
description: Work item implementing (part of) a requirement from the SRS
title: "FR-xx: <title>"
labels: ["feature"]
body:
  - type: input
    id: requirement
    attributes:
      label: Requirement ID
      description: FR-xx / NFR-xx from docs/requirements/srs.md (or "infra/thesis" if not requirement-bound)
      placeholder: FR-01
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What must exist when this card is Done
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable checks, copied/refined from the SRS entry
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: MoSCoW priority
      options: [Must, Should, Could, "Won't (this increment)"]
    validations:
      required: true
