name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC

jobs:
  audit-dependencies:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      # --all-extras: without it `uv export` omits optional extras, so the two
      # most security-relevant dependencies we have — playwright and docker,
      # which drive the retest sandbox — were never audited (#182).
      - run: uv export --no-emit-project --locked --all-extras -o requirements-audit.txt
      - run: uv tool run pip-audit -r requirements-audit.txt

  sast:
    name: Bandit (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: uv tool run bandit -r src scripts -ll

  secrets:
    name: Gitleaks (history scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      # `security-events: write` alone REPLACES the default permission set, so
      # `contents: read` has to be restated or checkout only works because the
      # repo is public.
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          # The React SPA was invisible to every security tool until #182 — no
          # CodeQL language, no Dependabot ecosystem, no npm audit.
          #
          # Both languages in ONE job on purpose: a build matrix would rename
          # the check contexts to "CodeQL (python)" / "CodeQL (javascript-
          # typescript)", and branch protection requires a context named exactly
          # "CodeQL". Neither matrix leg satisfies it, so every PR would sit
          # BLOCKED forever with all checks green. Verified on this PR before
          # collapsing it back.
          languages: python, javascript-typescript
      - uses: github/codeql-action/analyze@v4
