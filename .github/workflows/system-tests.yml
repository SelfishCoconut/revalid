name: System tests

on:
  schedule:
    - cron: "0 3 * * *" # nightly 03:00 UTC
  workflow_dispatch:

jobs:
  system:
    name: E2E against lab targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # No `--extra browser` / Playwright install: FR-14 was dropped and
      # src/revalid/browser.py deleted in ADR-0033, so both were provisioning a
      # browser for code that no longer exists (#182).
      - run: uv sync --locked --extra sandbox
      - name: Build the sandbox toolbox image (issue #105)
        # The agent's container is egress-locked, so its tools must be baked in;
        # the image is built locally rather than pulled from a registry.
        run: make sandbox-image
      - name: Start lab targets
        run: |
          if [ -f lab/docker-compose.yml ]; then
            docker compose -f lab/docker-compose.yml up -d
            echo "waiting for Juice Shop on http://localhost:3000 ..."
            for i in $(seq 1 60); do
              if curl -sf -o /dev/null http://localhost:3000/rest/admin/application-version; then
                echo "lab is up"; break; fi
              sleep 2
            done
            curl -sf -o /dev/null http://localhost:3000/rest/admin/application-version \
              || { echo "lab did not become ready" >&2; exit 1; }
          else
            echo "No lab defined yet — running system-marked tests without targets."
          fi
      - name: Run system tests
        run: uv run pytest -m system --no-cov --junit-xml=system-report.xml
      # Every system test skips itself when Docker, the lab or a backend is
      # missing, so a degraded runner produced a green nightly that had verified
      # nothing (#182). The retest suite is the one that proves the egress lock,
      # so a skip there is a failure. test_ollama_extraction is exempt: it needs
      # an Ollama server the nightly deliberately does not provision.
      - name: A skipped retest system test is a failed nightly
        run: |
          uv run python - <<'PY'
          import sys, xml.etree.ElementTree as ET

          root = ET.parse("system-report.xml").getroot()
          cases = list(root.iter("testcase"))
          skipped = [
              f"{c.get('classname')}::{c.get('name')}"
              for c in cases
              if c.find("skipped") is not None
              and "test_retest_session_system" in (c.get("classname") or "")
          ]
          print(f"{len(cases)} system tests collected, {len(skipped)} retest tests skipped")
          if skipped:
              sys.exit(
                  "retest system tests skipped — the sandbox or lab did not provision, "
                  "so the egress lock was never verified: " + ", ".join(skipped)
              )
          PY
      - name: Tear down lab
        if: always()
        run: |
          if [ -f lab/docker-compose.yml ]; then
            docker compose -f lab/docker-compose.yml down -v
          fi
