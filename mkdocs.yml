site_name: revalid
site_description: AI-Driven System for the Revalidation of Pentest Findings (TFG, ESII-UCLM)
site_url: https://selfishcoconut.github.io/revalid/
repo_url: https://github.com/SelfishCoconut/revalid
docs_dir: docs
exclude_docs: |
  normativa/
  tfg_description

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          # Material for MkDocs renders .mermaid blocks natively (theme-aware,
          # light/dark). The mkdocs-mermaid2 plugin's custom fence collided with
          # it: nothing emitted a mermaid.initialize() call, so every diagram on
          # the site rendered as a "Syntax error" bomb. This is the supported path.
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true

nav:
  - Home: index.md
  - Architecture:
      - How it works (workflow): architecture/workflow.md
      - C4 model: architecture/c4.md
      - Class model: architecture/class-model.md
      - Data model: architecture/data-model.md
      - Subsystem flows: architecture/subsystem-flows.md
  - Requirements:
      - SRS: requirements/srs.md
      - Use-case model: requirements/use-cases.md
  - API reference: reference/api.md
  - UML (generated): reference/uml.md
  - ADRs: adr/README.md
  - Roadmap: roadmap.md
  - Development plan: development-plan.md
  - AI usage: ai-usage/AI_USAGE_LOG.md
