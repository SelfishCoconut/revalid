site_name: revalid
site_description: AI-Driven System for the Revalidation of Pentest Findings (TFG, ESII-UCLM)
site_url: https://selfishcoconut.github.io/revalid/
repo_url: https://github.com/SelfishCoconut/revalid
docs_dir: docs
exclude_docs: |
  normativa/
  tfg_description

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  # `useMaxWidth: false` makes every diagram render at its natural size instead
  # of being scaled down to the text column — the CSS in stylesheets/extra.css
  # then scrolls the overflow. Without this, wide C4 and sequence diagrams
  # shrink until their labels are unreadable.
  - mermaid2:
      arguments:
        securityLevel: loose
        # Required for <br/> to break lines inside labels: without HTML labels
        # mermaid renders plain SVG text and silently swallows the tag, which
        # is why multi-line labels used to run together ("developerperson").
        htmlLabels: true
        flowchart:
          useMaxWidth: false
          htmlLabels: true
          nodeSpacing: 55
          rankSpacing: 60
          padding: 12
        sequence:
          useMaxWidth: false
          diagramMarginX: 12
          diagramMarginY: 12
          actorFontSize: 15
          actorFontWeight: 500
          messageFontSize: 14
          noteFontSize: 14
          boxTextMargin: 8
          width: 165
        state:
          useMaxWidth: false
          nodeSpacing: 55
          rankSpacing: 60
        er:
          useMaxWidth: false
          fontSize: 14
          entityPadding: 14
          minEntityWidth: 130
        c4:
          useMaxWidth: false
          diagramMarginX: 12
          c4ShapeMargin: 40
          width: 250
          height: 260
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true

nav:
  - Home: index.md
  - Architecture:
      - How it works (workflow): architecture/workflow.md
      - C4 model: architecture/c4.md
      - Data model: architecture/data-model.md
      - Subsystem flows: architecture/subsystem-flows.md
  - Requirements (SRS): requirements/srs.md
  - API reference: reference/api.md
  - UML (generated): reference/uml.md
  - ADRs: adr/README.md
  - Roadmap: roadmap.md
  - Development plan: development-plan.md
  - AI usage: ai-usage/AI_USAGE_LOG.md
