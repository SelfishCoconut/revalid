<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="revalid — AI-driven revalidation of pentest findings">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f16"/>
      <stop offset="55%" stop-color="#10151e"/>
      <stop offset="100%" stop-color="#151c27"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8c7bff" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#8c7bff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8c7bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8c7bff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#8c7bff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8c7bff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="340" rx="28" fill="url(#panel)"/>
  <rect x="1" y="1" width="998" height="338" rx="27" fill="none" stroke="#212a37" stroke-width="2"/>
  <circle cx="176" cy="150" r="190" fill="url(#glow)"/>

  <!-- instrument mark: a scope reticle framing a live iris core -->
  <g transform="translate(96 78) scale(5.5)">
    <rect x="1.25" y="1.25" width="29.5" height="29.5" rx="8" fill="#151c27" stroke="#2b3646" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="8.5" fill="none" stroke="#2b3646" stroke-width="1.25"/>
    <path d="M16 3.5v6M16 22.5v6M3.5 16h6M22.5 16h6" stroke="#6a7788" stroke-width="1.25" stroke-linecap="round"/>
    <circle cx="16" cy="16" r="6" fill="none" stroke="#8c7bff" stroke-opacity="0.45" stroke-width="1.25"/>
    <circle cx="16" cy="16" r="3.4" fill="#8c7bff"/>
  </g>

  <g font-family="'IBM Plex Sans','Segoe UI',Inter,Helvetica,Arial,sans-serif">
    <text x="300" y="148" fill="#e8edf4" font-size="104" font-weight="700" letter-spacing="-3">revalid</text>
    <text x="304" y="204" fill="#9aa7b8" font-size="26" font-weight="500">AI-driven revalidation of pentest findings</text>
  </g>

  <rect x="304" y="234" width="280" height="2" rx="1" fill="url(#rule)"/>

  <g font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="23">
    <circle cx="313" cy="280" r="7" fill="#ff5d6e"/>
    <text x="331" y="288" fill="#ff8a95">still open</text>
    <circle cx="502" cy="280" r="7" fill="#f2b44e"/>
    <text x="520" y="288" fill="#f4c06a">inconclusive</text>
    <circle cx="742" cy="280" r="7" fill="#33d19a"/>
    <text x="760" y="288" fill="#56e0b0">fixed</text>
  </g>

  <text x="928" y="92" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="17" fill="#6a7788" text-anchor="end">TFG · ESII — UCLM</text>
</svg>
